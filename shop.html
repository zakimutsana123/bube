<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shop · BuBe.co</title>
    <meta name="description" content="Katalog BuBe.co: tunik, dress, blouse, outer, setelan wanita, dan hijab. Filter ukuran, warna, dan harga." />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body data-page="shop">
    <div data-slot="header"></div>

    <main class="container" style="padding: 22px 16px 0;">
      <div class="section" style="padding-top: 0;">
        <div class="eyebrow">SHOP</div>
        <h1 class="h2" style="margin-top: 10px;">Katalog BuBe.co</h1>
        <p class="muted" style="margin-top: 10px; max-width: 70ch; line-height: 1.75;">
          Filter sesuai kebutuhanmu, temukan potongan yang rapi, warna yang lembut, dan detail premium untuk harian hingga formal.
        </p>
      </div>

      <div class="grid" style="margin-top: 16px; grid-template-columns: 1fr; gap: 16px;">
        <section class="card pad">
          <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;">
            <form id="shopSearchForm" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; flex: 1;">
              <input
                id="shopSearch"
                placeholder="Cari produk..."
                style="flex: 1; min-width: 220px; height: 44px; border-radius: 14px; border: 1px solid rgba(var(--gold-1),0.16); background: rgba(var(--surface-1),0.75); padding: 0 12px; outline: 0; color: rgb(var(--ink-1));"
              />
              <button class="btn primary" type="submit">Cari</button>
            </form>
            <div class="muted" id="shopCount" style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;"></div>
          </div>

          <div style="margin-top: 14px; display:flex; gap: 10px; flex-wrap: wrap; align-items:center;">
            <div class="muted" style="font-size: 12px; font-weight: 800; letter-spacing: 0.18em;">SORT</div>
            <a class="btn" id="sortRekom" href="./shop.html">Rekomendasi</a>
            <a class="btn" id="sortTerbaru" href="./shop.html?sort=terbaru">Terbaru</a>
            <a class="btn" id="sortTerlaris" href="./shop.html?sort=terlaris">Terlaris</a>
            <a class="btn" id="sortAsc" href="./shop.html?sort=harga-asc">Harga ↑</a>
            <a class="btn" id="sortDesc" href="./shop.html?sort=harga-desc">Harga ↓</a>
          </div>
        </section>

        <section class="card pad">
          <div class="eyebrow">FILTER</div>
          <div style="margin-top: 12px;" id="filterCategories"></div>

          <div class="grid cols-2" style="margin-top: 12px;">
            <div>
              <div class="muted" style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em;">UKURAN</div>
              <select id="sizeSel" style="margin-top: 10px; width: 100%; height: 44px; border-radius: 14px; border: 1px solid rgba(var(--gold-1),0.16); background: rgba(var(--surface-1),0.75); padding: 0 12px; outline: 0; color: rgb(var(--ink-1));">
                <option value="">Semua</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
              </select>
            </div>
            <div>
              <div class="muted" style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em;">WARNA</div>
              <select id="colorSel" style="margin-top: 10px; width: 100%; height: 44px; border-radius: 14px; border: 1px solid rgba(var(--gold-1),0.16); background: rgba(var(--surface-1),0.75); padding: 0 12px; outline: 0; color: rgb(var(--ink-1));">
                <option value="">Semua</option>
                <option value="Beige">Beige</option>
                <option value="Cream">Cream</option>
                <option value="Soft Pink">Soft Pink</option>
                <option value="White">White</option>
                <option value="Brown">Brown</option>
              </select>
            </div>
          </div>

          <form id="priceForm" style="margin-top: 14px;">
            <div class="grid cols-2">
              <div>
                <div class="muted" style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em;">MIN</div>
                <input id="minPrice" placeholder="0" style="margin-top: 10px; width: 100%; height: 44px; border-radius: 14px; border: 1px solid rgba(var(--gold-1),0.16); background: rgba(var(--surface-1),0.75); padding: 0 12px; outline: 0; color: rgb(var(--ink-1));" />
              </div>
              <div>
                <div class="muted" style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em;">MAX</div>
                <input id="maxPrice" placeholder="999999" style="margin-top: 10px; width: 100%; height: 44px; border-radius: 14px; border: 1px solid rgba(var(--gold-1),0.16); background: rgba(var(--surface-1),0.75); padding: 0 12px; outline: 0; color: rgb(var(--ink-1));" />
              </div>
            </div>
            <button class="btn primary" type="submit" style="margin-top: 12px;">Terapkan Harga</button>
            <a class="btn" href="./shop.html" style="margin-top: 12px;">Reset Filter</a>
          </form>
        </section>
      </div>

      <section class="section">
        <div class="grid cols-3" id="shopGrid"></div>
      </section>
    </main>

    <div data-slot="footer"></div>
    <div data-slot="fab"></div>

    <script src="./assets/js/env.js"></script>
    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
